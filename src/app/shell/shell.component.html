<div
  #shellRoot
  class="shell-root"
  data-testid="shell-root"
  role="application"
  aria-label="Application shell"
  [style.--shell-sidebar-width]="shellSidebarColumnWidth$ | async"
  [style.--shell-secondary-panel-width]="shellSecondaryPanelWidthPx$ | async"
  [style.--shell-bottom-panel-height]="shellBottomPanelHeightPx$ | async"
  [style.--shell-secondary-splitter-width]="((secondaryPanelVisible$ | async) ? '4px' : '0px')"
  [style.--shell-bottom-splitter-height]="((bottomPanelVisible$ | async) ? '4px' : '0px')"
>
  <app-sidebar
    class="shell-sidebar"
    [items]="(sidebarItems$ | async) ?? []"
    [collapsed]="!(sidebarVisible$ | async)"
    [activeItemId]="activeSidebarItem$ | async"
    (collapsedChange)="onSidebarCollapsedChange($event)"
    (activeItemChange)="onSidebarActiveItemChange($event)"
  ></app-sidebar>

  <div class="shell-workspace" role="region" aria-label="Workspace">
    <app-toolbar class="shell-toolbar" [actions]="(toolbarActions$ | async) ?? []"></app-toolbar>
    <app-dock-zone-panel
      class="shell-primary-workspace"
      [zone]="DockZone.PrimaryWorkspace"
      [tabs]="(shellTabs$ | async) ?? []"
      [activeTabId]="(activeShellTabId$ | async) ?? ''"
      [visible]="true"
      [closeGuards]="(closeGuards$ | async) ?? {}"
      (activeTabChange)="onShellTabSelected($event)"
      (tabClosed)="onShellTabClosed($event)"
      (closeGuardTimeout)="onCloseGuardTimeout($event)"
      (newTabRequested)="onNewTabRequested()"
      (tabReordered)="onDockZoneTabReordered(DockZone.PrimaryWorkspace, $event)"
    ></app-dock-zone-panel>
    @if (showTabAddModal) {
      <app-tab-add-modal
        [availableTabs]="(availableTabsForModal$ | async) ?? []"
        (tabSelected)="onTabAddModalSelected($event)"
        (dismissed)="onTabAddModalDismissed()"
      ></app-tab-add-modal>
    }
    <div
      class="secondary-splitter-handle"
      data-testid="secondary-splitter"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize secondary panel"
      (pointerdown)="onSecondarySplitterPointerDown($event)"
      (pointermove)="onSecondarySplitterPointerMove($event)"
      (pointerup)="onSecondarySplitterPointerUp($event)"
      (pointercancel)="onSecondarySplitterPointerCancel($event)"
    ></div>
    <app-dock-zone-panel
      class="shell-secondary-panel"
      [zone]="DockZone.SecondaryPanel"
      [visible]="(secondaryPanelVisible$ | async) ?? false"
      [size]="(secondaryPanelWidth$ | async) ?? 300"
      [tabs]="(secondaryPanelEntries$ | async) ?? []"
      [activeTabId]="(activeSecondaryPanelEntryId$ | async) ?? ''"
      (visibilityChange)="onSecondaryPanelVisibilityChange($event)"
      (activeTabChange)="onSecondaryPanelActiveEntryChange($event)"
      (sizeChange)="onSecondaryPanelWidthChange($event)"
      (tabReordered)="onDockZoneTabReordered(DockZone.SecondaryPanel, $event)"
    ></app-dock-zone-panel>
    <div
      class="bottom-splitter-handle"
      data-testid="bottom-splitter"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize bottom panel"
      (pointerdown)="onBottomSplitterPointerDown($event)"
      (pointermove)="onBottomSplitterPointerMove($event)"
      (pointerup)="onBottomSplitterPointerUp($event)"
      (pointercancel)="onBottomSplitterPointerCancel($event)"
    ></div>
    <app-dock-zone-panel
      class="shell-bottom-panel"
      [zone]="DockZone.BottomPanel"
      [visible]="(bottomPanelVisible$ | async) ?? false"
      [size]="(bottomPanelHeight$ | async) ?? 220"
      [tabs]="(bottomPanelTabs$ | async) ?? []"
      [activeTabId]="activeBottomPanelId"
      (visibilityChange)="onBottomPanelVisibilityChange($event)"
      (sizeChange)="onBottomPanelHeightChange($event)"
      (activeTabChange)="onBottomPanelActivePanelChange($event)"
      (tabReordered)="onDockZoneTabReordered(DockZone.BottomPanel, $event)"
    ></app-dock-zone-panel>
  </div>

  <footer class="shell-statusbar" role="contentinfo" aria-label="Status bar">
    <app-status-bar
      [leftItems]="(statusBarLeftItems$ | async) ?? []"
      [rightItems]="(statusBarRightItems$ | async) ?? []"
    ></app-status-bar>
  </footer>
</div>

<!-- Drag ghost overlay — outside shell-root to avoid overflow clipping -->
<app-drag-ghost></app-drag-ghost>
